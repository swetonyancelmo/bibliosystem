<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioSystem — Perfil</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/perfil.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <header class="navbar">
        <div class="navbar__inner">
            <a href="index.html" class="navbar__logo">BiblioSystem</a>

            <nav class="navbar__nav">
                <a href="index.html"       class="navbar__link">Início</a>
                <a href="emprestimos.html" class="navbar__link">Empréstimos</a>
                <a href="livros.html"      class="navbar__link" id="navLivros" style="display:none">Livros</a>
                <a href="admin.html"       class="navbar__link" id="navAdmin"  style="display:none">Admin</a>
            </nav>

            <a href="perfil.html" class="navbar__avatar navbar__link--active" id="navAvatar" aria-label="Perfil do usuário"></a>
        </div>
    </header>

    <main class="main">
        <div class="main__inner">

            <section class="perfil">
                <div class="perfil__avatar" id="perfilAvatar">?</div>
                <h1 class="perfil__nome" id="perfilNome">—</h1>
                <p class="perfil__tipo" id="perfilTipo">—</p>
            </section>

            <div class="perfil-card">

                <h2>Editar dados pessoais</h2>

                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Seu nome completo">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="senha">Nova senha</label>
                    <input type="password" id="senha" placeholder="Digite uma nova senha">
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" placeholder="Confirme a senha">
                </div>

                <button class="btn-salvar" id="btnSalvar">
                    Salvar alterações
                </button>

                <a href="login.html" id="btnSair" class="btn-sair">Sair da conta</a>

            </div>

        </div>
    </main>

    <script src="js/perfil.js"></script>
    <script src="js/navbar.js"></script>

</body>
</html>
